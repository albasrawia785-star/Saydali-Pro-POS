name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      - name: Unzip Project Files
        run: |
          unzip "pos.zip--صيدلي-برو" -d temp_unzip || unzip *.zip -d temp_unzip || true
          TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \;)
          if [ -n "$TARGET_DIR" ]; then
            echo "Found project files in: $TARGET_DIR"
            cp -r $TARGET_DIR/* .
          else
            echo "Error: package.json not found!"
            exit 1
          fi
          rm -rf temp_unzip

      - name: Deep Clean Environment
        run: |
          rm -rf node_modules package-lock.json dist android
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.json" -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --force

      - name: Inject Robust Native Web Share Script
        run: |
          # حقن سكربت صريح يمسك بيانات الـ Blob فور إنشائها ويفتح قائمة المشاركة للواتساب فوراً
          cat << 'EOF' > inject_share.js
          (function() {
            let lastBlob = null;

            // 1. التقاط الـ Blob الخاص بالنسخة الاحتياطية عند توليدها
            const originalCreateObjectURL = URL.createObjectURL;
            URL.createObjectURL = function(blob) {
              lastBlob = blob;
              return originalCreateObjectURL.call(this, blob);
            };

            // 2. الاستماع لأي ضغطة على زر النسخ الاحتياطي
            document.addEventListener('click', async (e) => {
              const btn = e.target.closest('button, a');
              if (btn && btn.innerText && btn.innerText.includes('تنزيل النسخة الاحتياطية')) {
                // الانتظار قليلاً لضمان تشكيل ملف الـ Blob
                setTimeout(async () => {
                  if (!lastBlob) return;

                  const dateStr = new Date().toISOString().slice(0, 10);
                  const fileName = `Saydali-Pro-Backup-${dateStr}.json`;
                  const file = new File([lastBlob], fileName, { type: 'application/json' });

                  // 3. استدعاء المشاركة الخاصة بالنظام مباشرة (Native Web Share)
                  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                      await navigator.share({
                        title: 'النسخة الاحتياطية',
                        text: 'ملف النسخة الاحتياطية لتطبيق صيدلي برو',
                        files: [file]
                      });
                    } catch (err) {
                      console.log('تم إلغاء المشاركة بواسطة المستخدم');
                    }
                  } else {
                    // في حال عدم توفر مشاركة الملفات، تحويل الملف إلى رابط تنزيل مباشر
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(lastBlob);
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                  }
                }, 300);
              }
            }, true);
          })();
          EOF

          if [ -f "index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' index.html
          elif [ -f "public/index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' public/index.html
          fi

      - name: Build Web Application
        run: npm run build

      - name: Copy Injected Script to Dist
        run: |
          cp inject_share.js dist/ || true

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor Android
        run: |
          APP_NAME="دفتر الديون"
          PACKAGE_ID="com.saydalipro.pos"

          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Inject Android Web Chrome Client for File Sharing
        run: |
          # تفعيل دعم مشاركة الملفات وحفظها داخل الـ WebView في أندرويد
          ACTIVITY_PATH="android/app/src/main/java/com/saydalipro/pos/MainActivity.java"
          if [ ! -f "$ACTIVITY_PATH" ]; then
            ACTIVITY_PATH=$(find android/app/src/main/java -name "MainActivity.java" || find android/app/src/main/java -name "MainActivity.kt")
          fi
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_PATH
          fi

      - name: Update Kotlin & Gradle Versions for Java 21
        run: |
          cd android
          if [ -f "build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' build.gradle
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' build.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          
          keytool -genkey -v -keystore release.keystore -alias saydali_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaydaliPass123" -keypass "SaydaliPass123" -dname "CN=SaydaliPro, OU=Dev, O=App, L=Basra, S=Basra, C=IQ"

          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"SaydaliPass123" --key-pass pass:"SaydaliPass123" --out app/build/outputs/apk/release/Saydali-Pro-Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydali-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/Saydali-Pro-Signed.apk
