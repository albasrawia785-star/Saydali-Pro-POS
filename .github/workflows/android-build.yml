name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      - name: Unzip Project Files
        run: |
          unzip "pos.zip--صيدلي-برو" -d temp_unzip || unzip *.zip -d temp_unzip || true
          TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \;)
          if [ -n "$TARGET_DIR" ]; then
            echo "Found project files in: $TARGET_DIR"
            cp -r $TARGET_DIR/* .
          else
            echo "Error: package.json not found!"
            exit 1
          fi
          rm -rf temp_unzip

      - name: Deep Clean Environment
        run: |
          rm -rf node_modules package-lock.json dist android
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.json" -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --force

      - name: Inject Web Share Interceptor Script
        run: |
          # حقن سكربت يعترض الضغط على زر تنزيل النسخة الاحتياطية ويظهر اللوحة المنبثقة مباشرة
          cat << 'EOF' > inject_share.js
          (function() {
            document.addEventListener('DOMContentLoaded', () => {
              // الاعتراض على مستوى إنشاء الروابط وملفات الـ Blob
              const originalCreateObjectURL = URL.createObjectURL;
              let currentBlobFile = null;

              URL.createObjectURL = function(blob) {
                const url = originalCreateObjectURL.call(this, blob);
                currentBlobFile = new File([blob], `backup-${new Date().toISOString().slice(0,10)}.json`, { type: "application/json" });
                return url;
              };

              // التقاط الضغط على أي زر يحمل نص تنزيل النسخة الاحتياطية
              document.addEventListener('click', (e) => {
                const target = e.target.closest('button, a');
                if (target && target.innerText.includes('تنزيل النسخة الاحتياطية')) {
                  setTimeout(() => {
                    showShareModal();
                  }, 300);
                }
              }, true);

              function showShareModal() {
                if (document.getElementById('backup-share-modal')) return;
                const modal = document.createElement('div');
                modal.id = 'backup-share-modal';
                modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:99999;direction:rtl;';
                modal.innerHTML = `
                  <div style="background:#fff;padding:24px;border-radius:16px;max-width:360px;width:85%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2);font-family:sans-serif;">
                    <div style="width:48px;height:48px;background:#e7f5ff;color:#1c7ed6;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto;font-size:24px;">✓</div>
                    <h3 style="margin:0 0 8px 0;color:#111;font-size:18px;">تم تجهيز النسخة الاحتياطية</h3>
                    <p style="color:#666;font-size:14px;line-height:1.5;margin:0 0 20px 0;">يرجى اختيار المشاركة لحفظ الملف على الهاتف أو إرساله عبر التطبيقات.</p>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                      <button id="btn-share-action" style="background:#0d6efd;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">مشاركة الملف</button>
                      <button onclick="document.getElementById('backup-share-modal').remove()" style="background:#f8f9fa;color:#495057;border:1px solid #dee2e6;padding:10px;border-radius:8px;cursor:pointer;font-size:14px;">إغلاق</button>
                    </div>
                  </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('btn-share-action').onclick = async () => {
                  if (currentBlobFile && navigator.canShare && navigator.canShare({ files: [currentBlobFile] })) {
                    try {
                      await navigator.share({ files: [currentBlobFile], title: 'النسخة الاحتياطية' });
                    } catch (err) {}
                  } else {
                    alert('المشاركة المباشرة غير مدعومة، تم حفظ الملف في ذاكرة التطبيق.');
                  }
                };
              }
            });
          })();
          EOF

          if [ -f "index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' index.html
          elif [ -f "public/index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' public/index.html
          fi

      - name: Build Web Application
        run: npm run build

      - name: Copy Injected Script to Dist
        run: |
          cp inject_share.js dist/ || true

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor Android
        run: |
          # يمكنك تغيير اسم التطبيق والمعرف من السطرين التاليين:
          APP_NAME=" دفتر الديون"
          PACKAGE_ID="com.saydalipro.pos"

          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Inject Camera Permissions into AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' $MANIFEST_PATH
          fi

      - name: Update Kotlin & Gradle Versions for Java 21
        run: |
          cd android
          if [ -f "build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' build.gradle
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' build.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          
          keytool -genkey -v -keystore release.keystore -alias saydali_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaydaliPass123" -keypass "SaydaliPass123" -dname "CN=SaydaliPro, OU=Dev, O=App, L=Basra, S=Basra, C=IQ"

          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"SaydaliPass123" --key-pass pass:"SaydaliPass123" --out app/build/outputs/apk/release/Saydali-Pro-Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydali-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/Saydali-Pro-Signed.apk
