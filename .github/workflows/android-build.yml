name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      - name: Unzip Project Files
        run: |
          unzip "pos.zip--صيدلي-برو" -d temp_unzip || unzip *.zip -d temp_unzip || true
          TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \;)
          if [ -n "$TARGET_DIR" ]; then
            echo "Found project files in: $TARGET_DIR"
            cp -r $TARGET_DIR/* .
          else
            echo "Error: package.json not found!"
            exit 1
          fi
          rm -rf temp_unzip

      - name: Deep Clean Environment
        run: |
          rm -rf node_modules package-lock.json dist android
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.json" -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Capacitor Share
        run: |
          npm install --force
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/share@latest @capacitor/filesystem@latest

      - name: Inject Native Share Script
        run: |
          # script لحفظ الملف في الذاكرة المؤقتة وفتح نافذة المشاركة الأصيلة للأندرويد
          cat << 'EOF' > inject_share.js
          (function() {
            document.addEventListener('DOMContentLoaded', () => {
              let currentBlobData = null;

              const originalCreateObjectURL = URL.createObjectURL;
              URL.createObjectURL = function(blob) {
                const url = originalCreateObjectURL.call(this, blob);
                if (blob.type === 'application/json' || blob.type === 'application/octet-stream') {
                  const reader = new FileReader();
                  reader.onloadend = function() {
                    currentBlobData = reader.result.split(',')[1]; // تحويل لـ Base64
                  };
                  reader.readAsDataURL(blob);
                }
                return url;
              };

              document.addEventListener('click', (e) => {
                const target = e.target.closest('button, a');
                if (target && target.innerText.includes('تنزيل النسخة الاحتياطية')) {
                  setTimeout(() => {
                    triggerNativeShare();
                  }, 500);
                }
              }, true);

              async function triggerNativeShare() {
                const fileName = `backup-${new Date().toISOString().slice(0,10)}.json`;
                
                try {
                  // استخدام الإضافات الأصيلة المتاحة في Capacitor
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
                    const { Filesystem, Share } = window.Capacitor.Plugins;
                    
                    // 1. كتابة الملف مؤقتاً في ذاكرة التطبيق
                    const fileResult = await Filesystem.writeFile({
                      path: fileName,
                      data: currentBlobData,
                      directory: 'CACHE'
                    });

                    // 2. فتح نافذة المشاركة الأصيلة لنظام أندرويد (تتيح الواتساب، تليجرام، إلخ)
                    await Share.share({
                      title: 'النسخة الاحتياطية',
                      text: 'ملف النسخة الاحتياطية للنظام',
                      url: fileResult.uri,
                      dialogTitle: 'مشاركة النسخة الاحتياطية عبر:'
                    });
                  } else if (navigator.share && currentBlobData) {
                    const blob = await fetch(`data:application/json;base64,${currentBlobData}`).then(r => r.blob());
                    const file = new File([blob], fileName, { type: "application/json" });
                    await navigator.share({
                      files: [file],
                      title: 'النسخة الاحتياطية'
                    });
                  } else {
                    alert('لم يتم العثور على تطبيق للمشاركة.');
                  }
                } catch (err) {
                  console.log('تم إلغاء المشاركة أو حدث خطأ:', err);
                }
              }
            });
          })();
          EOF

          if [ -f "index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' index.html
          elif [ -f "public/index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' public/index.html
          fi

      - name: Build Web Application
        run: npm run build

      - name: Copy Injected Script to Dist
        run: |
          cp inject_share.js dist/ || true

      - name: Initialize Capacitor Android
        run: |
          APP_NAME="دفتر الديون"
          PACKAGE_ID="com.saydalipro.pos"

          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Inject Permissions into AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' $MANIFEST_PATH
          fi

      - name: Update Kotlin & Gradle Versions for Java 21
        run: |
          cd android
          if [ -f "build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' build.gradle
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' build.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          
          keytool -genkey -v -keystore release.keystore -alias saydali_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaydaliPass123" -keypass "SaydaliPass123" -dname "CN=SaydaliPro, OU=Dev, O=App, L=Basra, S=Basra, C=IQ"

          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"SaydaliPass123" --key-pass pass:"SaydaliPass123" --out app/build/outputs/apk/release/Saydali-Pro-Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydali-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/Saydali-Pro-Signed.apk
