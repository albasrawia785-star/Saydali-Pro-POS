name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      - name: Unzip Project Files
        run: |
          unzip "pos.zip--صيدلي-برو" -d temp_unzip || unzip *.zip -d temp_unzip || true
          TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \;)
          if [ -n "$TARGET_DIR" ]; then
            echo "Found project files in: $TARGET_DIR"
            cp -r $TARGET_DIR/* .
          else
            echo "Error: package.json not found!"
            exit 1
          fi
          rm -rf temp_unzip

      - name: Deep Clean Environment
        run: |
          rm -rf node_modules package-lock.json dist android
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.json" -delete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --force

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Native Plugins
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest

      - name: Inject Native Share & Download Script
        run: |
          # حقن سكربت يستخرج بيانات الملف ويستخدم إضافات الأندرويد الأصيلة لتنزيل الملف وفتح نافذة المشاركة
          cat << 'EOF' > dist/inject_share.js
          (function() {
            let pendingBase64 = null;

            // 1. التقاط بيانات الـ JSON وتحويلها فوراً إلى Base64
            const originalCreate = URL.createObjectURL;
            URL.createObjectURL = function(blob) {
              if (blob) {
                const reader = new FileReader();
                reader.onloadend = function() {
                  if (reader.result) {
                    pendingBase64 = reader.result.split(',')[1];
                  }
                };
                reader.readAsDataURL(blob);
              }
              return originalCreate.call(this, blob);
            };

            // 2. الاعتراض عند الضغط على زر التنزيل
            document.addEventListener('click', async (e) => {
              const target = e.target.closest('button, a, div');
              if (target && target.innerText && target.innerText.includes('تنزيل النسخة الاحتياطية')) {
                
                setTimeout(async () => {
                  if (!pendingBase64) return;

                  const dateStr = new Date().toISOString().slice(0, 10);
                  const fileName = `Daftar-Aldeyon-Backup-${dateStr}.json`;

                  try {
                    // استخدام إضافة Capacitor Filesystem و Share الرسمية
                    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                      const { Filesystem, Share } = window.Capacitor.Plugins;

                      // أ) حفظ الملف فعلياً في ذاكرة التخزين المؤقتة للجهاز (CACHE/DOWNLOADS)
                      const savedFile = await Filesystem.writeFile({
                        path: fileName,
                        data: pendingBase64,
                        directory: 'CACHE'
                      });

                      // ب) فتح نافذة المشاركة الأصيلة الخاصة بنظام أندرويد (تسمح بالإرسال عبر الواتساب أو حفظه في الجهاز)
                      await Share.share({
                        title: 'النسخة الاحتياطية',
                        text: 'ملف النسخة الاحتياطية - دفتر الديون',
                        url: savedFile.uri,
                        dialogTitle: 'مشاركة أو حفظ النسخة الاحتياطية'
                      });
                    } else {
                      // طريقة احتياطية في حال الفحص
                      const blob = await fetch(`data:application/json;base64,${pendingBase64}`).then(r => r.blob());
                      const file = new File([blob], fileName, { type: 'application/json' });
                      if (navigator.share) {
                        await navigator.share({ files: [file], title: 'النسخة الاحتياطية' });
                      }
                    }
                  } catch (err) {
                    console.log('إلغاء أو خطأ في المشاركة:', err);
                  }
                }, 400);
              }
            }, true);
          })();
          EOF

          if [ -f "dist/index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' dist/index.html
          fi

      - name: Initialize Capacitor Android
        run: |
          APP_NAME="دفتر الديون"
          PACKAGE_ID="com.daftar.aldeyon"

          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Inject Android Storage & Share Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST_PATH
          fi

      - name: Update Kotlin & Gradle Versions for Java 21
        run: |
          cd android
          if [ -f "build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' build.gradle
            sed -i 's/kotlin_version = .*/kotlin_version = "1.9.24"/g' build.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew
          
          keytool -genkey -v -keystore release.keystore -alias saydali_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "SaydaliPass123" -keypass "SaydaliPass123" -dname "CN=DaftarAldeyon, OU=Dev, O=App, L=Basra, S=Basra, C=IQ"

          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"SaydaliPass123" --key-pass pass:"SaydaliPass123" --out app/build/outputs/apk/release/Daftar-Aldeyon-Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Aldeyon-APK
          path: android/app/build/outputs/apk/release/Daftar-Aldeyon-Signed.apk
